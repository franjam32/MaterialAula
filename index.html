<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10233f">
<title>MaterialAula · UF0679</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fa;color:#10233f;display:grid;place-items:center;min-height:100vh}
.card{padding:24px;border-radius:18px;background:#fff;box-shadow:0 12px 30px #10233f18;text-align:center;max-width:420px;margin:20px}.card p{color:#667085}
</style>
</head>
<body>
<div class="card"><strong>Cargando MaterialAula…</strong><p>Inventario sanitario UF0679</p></div>
<script>
(async()=>{
  try{
    const files=['runtime/app.0','runtime/app.1','runtime/app.2'];
    const parts=await Promise.all(files.map(async p=>{
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok) throw new Error('No se pudo cargar '+p);
      return (await r.text()).trim();
    }));
    const payload=parts.join('');
    if(payload.length%4!==0) throw new Error('Paquete de aplicación incompleto');
    const binary=atob(payload);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="card"><strong>Error al cargar la aplicación</strong><p>'+String(e.message)+'</p></div>';
  }
})();
</script>
</body>
</html>
