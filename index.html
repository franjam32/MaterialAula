<body>
<div class="card"><strong>Cargando MaterialAula…</strong><p>Inventario sanitario UF0679</p></div>
<script>
(async()=>{
 try{
   const files=['runtime/app.0','runtime/app.1','runtime/app.2'];
   const parts=await Promise.all(files.map(async p=>{
     const r=await fetch(p,{cache:'no-store'});
     if(!r.ok) throw new Error('No se pudo cargar '+p);
     return (await r.text()).trim();
   }));
   const binary=atob(parts.join(''));
   const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   let html=await new Response(stream).text();

   // 1) Colores acordados: Respiratorio azul · Circulatorio rojo.
   html=html.replace(/(respiratorio\\s*:\\s*\\{[^}]*class\\s*:\\s*)['"]red['"](\\s*,\\s*dot\\s*:\\s*)['"]🔴['"]/g,"$1'blue'$2'🔵'");
   html=html.replace(/(circulatorio\\s*:\\s*\\{[^}]*class\\s*:\\s*)['"]blue['"](\\s*,\\s*dot\\s*:\\s*)['"]🔵['"]/g,"$1'red'$2'🔴'");

   // 2) Catálogo técnico: nombres, alias, descripción específica y término de imagen.
   const helper=`
function normText(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function catalogMatch(q){
 const n=normText(q);if(!n)return null;
 const items=state.data.catalog?.length?state.data.catalog:seedCatalog;
 return items.find(x=>normText(x.name)===n)
 ||items.find(x=>String(x.aliases||'').split(',').some(a=>normText(a)===n))
 ||items.find(x=>normText(x.name).includes(n)||n.includes(normText(x.name))||String(x.aliases||'').split(',').some(a=>normText(a).includes(n)||n.includes(normText(a))))
 ||null;
}
`;

   html=html.replace('async function lookupImages(q){',helper+'async function lookupImages(q){');

   // 3) Sugerencias por alias y clasificación sugerida desde catálogo.
   html=html.replace(
     "const list=(state.data.catalog||seedCatalog).filter(x=>x.name.toLowerCase().includes(q)).slice(0,8);",
     "const nq=normText(q);const list=(state.data.catalog?.length?state.data.catalog:seedCatalog).filter(x=>normText(x.name).includes(nq)||normText(x.aliases||'').includes(nq)).slice(0,8);"
   );
   html=html.replace(
     "const c=(state.data.catalog||seedCatalog).find(x=>x.name===b.dataset.name);name.value=c.name;if(!$('#matDesc').value)$('#matDesc').value=c.description||'';sugg.classList.add('hidden')",
     "const c=(state.data.catalog?.length?state.data.catalog:seedCatalog).find(x=>x.name===b.dataset.name);name.value=c.name;if(!$('#matDesc').value)$('#matDesc').value=c.description||'';if(c.category){$('#matCategory').value=c.category;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('selected',x.dataset.cat===c.category))}sugg.classList.add('hidden')"
   );
   html=html.replace(
     "const local=(state.data.catalog||seedCatalog).find(x=>x.name.toLowerCase()===name.value.trim().toLowerCase());",
     "const local=catalogMatch(name.value.trim());"
   );

   // 4) Búsqueda de imágenes con el término técnico específico del catálogo.
   html=html.replace(
     /async function lookupImages\(q\)\{[\s\S]*?\}\nasync function lookupDescription/,
     `async function lookupImages(q){
 $('#lookupStatus').textContent='Buscando imágenes específicas en Wikimedia Commons…';
 $('#imageChoices').innerHTML='';
 try{
   const local=catalogMatch(q);
   const term=local?.image_query||q;
   const searches=[term,term+' medical device','"'+q+'" medical'];
   let pages=[];
   for(const search of searches){
     const url='https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({action:'query',generator:'search',gsrsearch:search,gsrnamespace:'6',gsrlimit:'12',prop:'imageinfo',iiprop:'url',iiurlwidth:'500',format:'json',origin:'*'});
     const r=await fetch(url),j=await r.json();
     pages=Object.values(j.query?.pages||{}).filter(p=>p.imageinfo?.[0]?.thumburl);
     if(pages.length)break;
   }
   pages=pages.slice(0,6);
   if(!pages.length)throw new Error('Sin resultados');
   $('#imageChoices').innerHTML=pages.map((p,i)=>\`<button type="button" class="image-choice" data-img="\${esc(p.imageinfo[0].thumburl)}" title="\${esc(p.title||'')}"><img src="\${esc(p.imageinfo[0].thumburl)}" alt="Resultado \${i+1}"></button>\`).join('');
   document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-img]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('#matImageUrl').value=b.dataset.img;$('#matImagePath').value='';$('#photoPreview').src=b.dataset.img;$('#photoPreview').classList.remove('hidden')});
   $('#lookupStatus').textContent='Selecciona la imagen que corresponda exactamente al material o usa tu cámara.';
 }catch(e){$('#lookupStatus').textContent='No se encontró una imagen fiable. Haz una foto o sube un archivo.'}
}
async function lookupDescription`
   );

   // 5) Descripción: catálogo específico primero; Wikipedia solo como último recurso.
   html=html.replace(
     /async function lookupDescription\(q\)\{[\s\S]*?\}\n\nfunction exportRows/,
     `async function lookupDescription(q){
 const local=catalogMatch(q);
 if(local?.description)return local.description;
 const url='https://es.wikipedia.org/w/api.php?'+new URLSearchParams({action:'query',generator:'search',gsrsearch:'"'+q+'" medicina',gsrlimit:'1',prop:'extracts',exintro:'1',explaintext:'1',exsentences:'2',format:'json',origin:'*'});
 const r=await fetch(url),j=await r.json(),p=Object.values(j.query?.pages||{})[0];
 const t=(p?.extract||'').slice(0,420);
 return t&&normText(t).includes(normText(q).split(' ')[0])?t:'';
}

function exportRows`
   );

   // 6) Sin fotografía real, no mostrar un fonendo ficticio.
   html=html.replace(/:'🩺'/g,":'📷'");

   // Corrección visual persistente: se inserta dentro de la app final, no en el loader.
   const colorFix = `
<script>
(function(){
  const COLORS={
    respiratorio:{emoji:'🔵',bg:'#dbeafe',fg:'#1d4ed8',border:'#60a5fa'},
    circulatorio:{emoji:'🔴',bg:'#fee2e2',fg:'#b91c1c',border:'#f87171'}
  };
  function replaceEmoji(el,emoji){
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
    const nodes=[];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(n){
      let s=n.nodeValue||'';
      s=s.split('🔴').join(emoji).split('🔵').join(emoji);
      n.nodeValue=s;
    });
  }
  function paint(el,key){
    const x=COLORS[key];
    replaceEmoji(el,x.emoji);
    el.style.setProperty('background-color',x.bg,'important');
    el.style.setProperty('color',x.fg,'important');
    el.style.setProperty('border-color',x.border,'important');
  }
  function fix(){
    document.querySelectorAll('[data-cat],button,span,div,a,label,option').forEach(function(el){
      const t=(el.textContent||'').trim().toLowerCase();
      if(!t || t.length>60) return;
      if(t.indexOf('respiratorio')>=0) paint(el,'respiratorio');
      else if(t.indexOf('circulatorio')>=0) paint(el,'circulatorio');
    });
    document.querySelectorAll('select option').forEach(function(o){
      const t=(o.textContent||'').replace('🔴','').replace('🔵','').trim();
      if(t.toLowerCase().indexOf('respiratorio')>=0) o.textContent='🔵 '+t;
      else if(t.toLowerCase().indexOf('circulatorio')>=0) o.textContent='🔴 '+t;
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fix); else fix();
  new MutationObserver(function(){requestAnimationFrame(fix)}).observe(document.documentElement,{subtree:true,childList:true});
  setTimeout(fix,50); setTimeout(fix,300); setTimeout(fix,1000);
})();
<\/script>`;
   html = html.replace('</body>', colorFix + '\n</body>');
   const catalogFix = `
<script>
(function(){
  const SUPA_URL='https://ptvroyhrtjtotcorriey.supabase.co';
  const SUPA_KEY='sb_publishable_0kUk1iNmq-MDaQnGI2lv3A_kOWzYPlf';
  let catalog=[];

  function norm(v){
    return String(v||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
  }

  async function loadCatalog(){
    try{
      const r=await fetch(SUPA_URL+'/rest/v1/catalog?select=name,aliases,category,description,image_query,default_image_url&active=eq.true&limit=500',{
        headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}
      });
      if(r.ok) catalog=await r.json();
    }catch(e){}
  }

  function findItem(q){
    const n=norm(q); if(!n) return null;
    let hit=catalog.find(x=>norm(x.name)===n);
    if(hit) return hit;
    hit=catalog.find(x=>String(x.aliases||'').split(',').some(a=>norm(a)===n));
    if(hit) return hit;
    hit=catalog.find(x=>norm(x.name).includes(n)||n.includes(norm(x.name)));
    if(hit) return hit;
    return catalog.find(x=>String(x.aliases||'').split(',').some(a=>{
      const na=norm(a); return na && (na.includes(n)||n.includes(na));
    }))||null;
  }

  function getMaterialInput(){
    return Array.from(document.querySelectorAll('input')).find(i=>{
      const p=(i.closest('.field')?.querySelector('label')?.textContent||'')+' '+(i.previousElementSibling?.textContent||'');
      return /material/i.test(p) || /material/i.test(i.name||'') || /material/i.test(i.id||'');
    }) || document.querySelector('input[type="text"]');
  }

  function getDescriptionField(){
    return Array.from(document.querySelectorAll('textarea,input')).find(el=>{
      const p=(el.closest('.field')?.querySelector('label')?.textContent||'')+' '+(el.previousElementSibling?.textContent||'');
      return /descripci[oó]n/i.test(p) || /desc/i.test(el.name||'') || /desc/i.test(el.id||'');
    });
  }

  function findCategoryElement(key){
    return Array.from(document.querySelectorAll('[data-cat],button,label,div')).find(el=>{
      const t=(el.textContent||'').trim().toLowerCase();
      return t===key || t.endsWith(key) || t.includes(key);
    });
  }

  function applyCatalog(item){
    if(!item) return;
    const desc=getDescriptionField();
    if(desc && (!desc.value || desc.value.trim().length<25 || /oxigenoterapia|dispositivo para asegurar la via aerea/i.test(desc.value))){
      desc.value=item.description||'';
      desc.dispatchEvent(new Event('input',{bubbles:true}));
      desc.dispatchEvent(new Event('change',{bubbles:true}));
    }
    if(item.category){
      const el=findCategoryElement(item.category==='respiratorio'?'respiratorio':item.category==='circulatorio'?'circulatorio':item.category);
      if(el && el.click) el.click();
    }
  }

  function addSuggestionBox(input){
    let box=document.getElementById('ma-catalog-suggest');
    if(!box){
      box=document.createElement('div');
      box.id='ma-catalog-suggest';
      box.style.cssText='position:absolute;z-index:99999;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.15);max-height:240px;overflow:auto;min-width:260px';
      document.body.appendChild(box);
    }
    const q=norm(input.value);
    if(q.length<2){box.style.display='none';return;}
    const list=catalog.filter(x=>norm(x.name).includes(q)||norm(x.aliases||'').includes(q)).slice(0,8);
    if(!list.length){box.style.display='none';return;}
    const rect=input.getBoundingClientRect();
    box.style.left=(rect.left+window.scrollX)+'px';
    box.style.top=(rect.bottom+window.scrollY+4)+'px';
    box.style.width=rect.width+'px';
    box.innerHTML=list.map((x,i)=>'<button type="button" data-i="'+i+'" style="display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:#fff;cursor:pointer">'+x.name+'</button>').join('');
    box.style.display='block';
    box.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{
      const item=list[i];
      input.value=item.name;
      input.dispatchEvent(new Event('input',{bubbles:true}));
      input.dispatchEvent(new Event('change',{bubbles:true}));
      applyCatalog(item);
      box.style.display='none';
    });
  }

  async function searchCommons(term,item){
    const baseName=(item?.name||term||'').trim();
    const aliases=String(item?.aliases||'').split(',').map(s=>s.trim()).filter(Boolean);
    const curated=item?.default_image_url||'';

    const queries=[
      item?.image_query,
      '"'+baseName+'" medical',
      baseName+' oxygen mask medical',
      baseName+' medical device',
      baseName+' healthcare equipment',
      aliases[0]?'"'+aliases[0]+'" medical':null
    ].filter(Boolean);

    const wanted=norm(baseName+' '+String(item?.aliases||'')+' '+String(item?.image_query||''))
      .split(' ').filter(w=>w.length>3);
    const banned=['federal','register','gazette','journal','article','document','paper','seal','certificate','logo','book','page','title page','newspaper','magazine'];

    let collected=[];
    if(curated){
      collected.push({
        title:'Imagen validada: '+baseName,
        imageinfo:[{thumburl:curated}],
        _score:999,
        _curated:true
      });
    }

    for(const q of queries){
      try{
        const url='https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({
          action:'query',generator:'search',gsrsearch:q,gsrnamespace:'6',gsrlimit:'40',
          prop:'imageinfo',iiprop:'url',iiurlwidth:'600',format:'json',origin:'*'
        });
        const rr=await fetch(url),j=await rr.json();
        const arr=Object.values(j.query?.pages||{}).filter(p=>{
          const u=p.imageinfo?.[0]?.thumburl;
          const title=(p.title||'').toLowerCase();
          if(!u)return false;
          if(/\\.(pdf|djvu)$/i.test(title))return false;
          if(banned.some(w=>title.includes(w)))return false;
          return true;
        }).map(p=>{
          const title=norm(String(p.title||'').replace(/^file:/i,''));
          let score=0;
          wanted.forEach(w=>{if(title.includes(w))score+=3});
          if(/mask|mascarilla|oxygen|venturi|medical|device|equipment|cannula|airway|catheter|splint|defibrillator|stretcher|suction|laryngoscope|syringe|tourniquet|bandage|stethoscope|oximeter/.test(title))score+=5;
          if(/federal|register|gazette|journal|paper|document|book|title page|newspaper/.test(title))score-=20;
          return {...p,_score:score};
        }).filter(p=>p._score>=3).sort((a,b)=>b._score-a._score);
        collected=collected.concat(arr);
        if(collected.length>=8)break;
      }catch(e){}
    }

    const seen=new Set();
    return collected.filter(p=>{
      const u=p.imageinfo?.[0]?.thumburl||'';
      if(!u||seen.has(u))return false;
      seen.add(u); return true;
    }).slice(0,8);
  }

  function findSearchButton(){
    return Array.from(document.querySelectorAll('button')).find(b=>/buscar/i.test((b.textContent||'').trim()) && /imagen/i.test((b.closest('.field')?.querySelector('label')?.textContent||'')+' '+(b.parentElement?.previousElementSibling?.textContent||'')));
  }

  function getImageUrlField(){
    return document.querySelector('#matImageUrl,input[name*="image_url"],input[id*="ImageUrl"]');
  }

  function renderChoices(items,anchor){
    let wrap=document.getElementById('ma-image-choices');
    if(!wrap){
      wrap=document.createElement('div');
      wrap.id='ma-image-choices';
      wrap.style.cssText='display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:8px;margin-top:10px';
      anchor.parentElement.appendChild(wrap);
    }
    if(!items.length){
      wrap.innerHTML='<div style="grid-column:1/-1;padding:10px;border:1px solid #f59e0b;border-radius:8px;background:#fffbeb">No se encontró una imagen fiable. Usa Foto para hacer una imagen real del material.</div>';
      return;
    }
    wrap.innerHTML=items.map((p,i)=>{
      const u=p.imageinfo[0].thumburl;
      return '<button type="button" data-u="'+u.replace(/"/g,'&quot;')+'" style="padding:4px;border:1px solid #cbd5e1;border-radius:10px;background:#fff"><img src="'+u+'" alt="opción '+(i+1)+'" style="width:100%;height:100px;object-fit:contain"></button>';
    }).join('');
    wrap.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const u=b.dataset.u;
      const field=getImageUrlField(); if(field){field.value=u;field.dispatchEvent(new Event('input',{bubbles:true}));field.dispatchEvent(new Event('change',{bubbles:true}));}
      const imgs=Array.from(document.querySelectorAll('img')).filter(im=>/preview|photo/i.test(im.id||'') || im.closest('#ma-image-choices')===null);
      const preview=imgs.find(im=>im.closest('.field') && /imagen/i.test(im.closest('.field')?.querySelector('label')?.textContent||'')) || document.querySelector('#photoPreview');
      if(preview){preview.src=u;preview.classList.remove('hidden');}
      wrap.querySelectorAll('button').forEach(x=>x.style.outline='none'); b.style.outline='3px solid #2563eb';
    });
  }

  function getAccessToken(){
    try{
      for(let i=0;i<localStorage.length;i++){
        const k=localStorage.key(i)||'';
        if(k.startsWith('sb-')&&k.endsWith('-auth-token')){
          const v=JSON.parse(localStorage.getItem(k)||'{}');
          return v.access_token||v.currentSession?.access_token||'';
        }
      }
    }catch(e){}
    return '';
  }

  async function loadMaterialImages(){
    try{
      const token=getAccessToken(); if(!token)return [];
      const rr=await fetch(SUPA_URL+'/rest/v1/materials?select=name,image_url,image_path,location_id&limit=1000',{
        headers:{apikey:SUPA_KEY,Authorization:'Bearer '+token}
      });
      return rr.ok?await rr.json():[];
    }catch(e){return []}
  }

  async function hydrateSummaryImages(){
    const mats=await loadMaterialImages();
    const catByName=new Map(catalog.map(x=>[norm(x.name),x]));
    const matByName=new Map(mats.map(x=>[norm(x.name),x]));

    document.querySelectorAll('.card,article,[class*="material"],[class*="item"]').forEach(card=>{
      const txt=(card.textContent||'').trim();
      if(!txt||txt.length<3)return;
      let match=null;
      for(const m of mats){
        if(txt.toLowerCase().includes(String(m.name||'').toLowerCase())){match=m;break}
      }
      if(!match)return;
      const cat=catByName.get(norm(match.name));
      const src=match.image_url||cat?.default_image_url||'';
      if(!src)return;

      let img=card.querySelector('img');
      if(!img){
        const candidate=Array.from(card.querySelectorAll('div,span')).find(el=>{
          const t=(el.textContent||'').trim();
          return t==='🩺'||t==='📷'||t==='🖼️'||(el.children.length===0&&el.clientWidth>=55&&el.clientWidth<=150&&el.clientHeight>=55&&el.clientHeight<=150);
        });
        if(candidate){
          img=document.createElement('img');
          candidate.textContent='';
          candidate.appendChild(img);
        }
      }
      if(img && img.dataset.maRealImage!=='1'){
        img.dataset.maRealImage='1';
        img.src=src;
        img.alt=match.name;
        img.style.width='100%';
        img.style.height='100%';
        img.style.objectFit='contain';
        img.style.borderRadius='12px';
      }
    });
  }

  function enhance(){
    const input=getMaterialInput();
    if(input && !input.dataset.maEnhanced){
      input.dataset.maEnhanced='1';
      input.addEventListener('input',()=>addSuggestionBox(input));
      input.addEventListener('change',()=>applyCatalog(findItem(input.value)));
      input.addEventListener('blur',()=>setTimeout(()=>{const b=document.getElementById('ma-catalog-suggest');if(b)b.style.display='none'},200));
      const item=findItem(input.value); if(item) applyCatalog(item);
    }

    const btn=findSearchButton();
    if(btn && !btn.dataset.maEnhanced){
      btn.dataset.maEnhanced='1';
      btn.addEventListener('click',async(ev)=>{
        ev.preventDefault(); ev.stopImmediatePropagation();
        const inp=getMaterialInput(); const item=findItem(inp?.value||'');
        if(item) applyCatalog(item);
        const term=inp?.value || item?.name || '';
        btn.disabled=true; const old=btn.textContent; btn.textContent='Buscando…';
        const imgs=await searchCommons(term,item);
        renderChoices(imgs,btn);
        btn.disabled=false; btn.textContent=old;
      },true);
    }
  }

  loadCatalog().then(()=>{enhance();hydrateSummaryImages()});
  new MutationObserver(()=>{enhance();setTimeout(hydrateSummaryImages,50)}).observe(document.documentElement,{subtree:true,childList:true});
  setInterval(enhance,1000);
})();
<\/script>`;

            box.textContent='';
            const im=document.createElement('img');
            im.src=src;im.alt=m.name||'Material sanitario';
            im.style.cssText='width:100%;height:100%;object-fit:contain;background:#fff;border-radius:10px';
            box.appendChild(im);
          }
        });

        // Inventario/listados tabulares: añadir columna de miniatura si la fila no la trae.
        document.querySelectorAll('table tbody tr').forEach(tr=>{
          const txt=(tr.textContent||'').toLowerCase();
          if(!txt.includes(String(m.name||'').toLowerCase()))return;
          if(tr.querySelector('[data-ma-thumb="'+CSS.escape(String(m.id))+'"]'))return;
          if(tr.querySelector('[data-img="'+CSS.escape(String(m.id))+'"]'))return;
          const td=document.createElement('td');
          td.setAttribute('data-ma-thumb',String(m.id));
          td.style.cssText='width:58px;min-width:58px;padding:6px';
          td.innerHTML='<div style="width:46px;height:46px;border-radius:9px;overflow:hidden;background:#eef2f6;display:grid;place-items:center"><img src="'+src.replace(/"/g,'&quot;')+'" alt="'+String(m.name||'').replace(/"/g,'&quot;')+'" style="width:100%;height:100%;object-fit:contain;background:#fff"></div>';
          tr.insertBefore(td,tr.firstElementChild);
        });
      }

      // Cabecera de tablas que ahora tienen miniatura añadida.
      document.querySelectorAll('table').forEach(table=>{
        if(!table.querySelector('tbody [data-ma-thumb]'))return;
        const hr=table.querySelector('thead tr');
        if(hr&&!hr.querySelector('[data-ma-thumb-head]')){
          const th=document.createElement('th');
          th.setAttribute('data-ma-thumb-head','1');
          th.textContent='Imagen';
          th.style.width='58px';
          hr.insertBefore(th,hr.firstElementChild);
        }
      });
    }finally{
      busy=false;
      if(queued){queued=false;setTimeout(refreshThumbs,30)}
    }
  }

  function schedule(){
    clearTimeout(schedule.t);
    schedule.t=setTimeout(refreshThumbs,70);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule);else schedule();
  const obs=new MutationObserver(schedule);
  obs.observe(document.documentElement,{subtree:true,childList:true});
  setTimeout(refreshThumbs,150);
  setTimeout(refreshThumbs,600);
  setTimeout(refreshThumbs,1500);
  setInterval(refreshThumbs,4000);
})();
<\/script>`;

   html = html.replace('</body>', thumbFix + '\n</body>');
   document.open();document.write(html);document.close();
 }catch(e){
   document.body.innerHTML='<div class="card"><strong>Error al cargar la aplicación</strong><p>'+String(e.message)+'</p></div>';
 }
})();
